name: Build and Release APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "App Debug Build $TAG_NAME" \
            --notes "Testing debug APK build for run ${{ github.run_number }} (attempt ${{ github.run_attempt }})." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            gh release view "$TAG_NAME"
            RELEASE_TAG=$(gh release view "$TAG_NAME" --json tagName --jq .tagName)
            RELEASE_TITLE=$(gh release view "$TAG_NAME" --json name --jq .name)
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url --jq .url)
            ASSET_FILENAME="app-debug.apk"

            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            echo "Release page URL: $RELEASE_URL"
            echo "APK asset filename: $ASSET_FILENAME"

            echo "### Release Succeeded :rocket:" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page URL**: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Title**: $RELEASE_TITLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Asset**: \`$ASSET_FILENAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The APK can be downloaded directly from the release Assets section." >> "$GITHUB_STEP_SUMMARY"
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed or was skipped."
            echo "The APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."

            echo "### :warning: Release Publishing Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publishing failed or encountered an error." >> "$GITHUB_STEP_SUMMARY"
            echo "However, the APK build and artifact upload succeeded!" >> "$GITHUB_STEP_SUMMARY"
            echo "The Actions artifact named \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          fi
